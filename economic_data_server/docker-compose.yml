services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: economic_data
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
    volumes:
      - economic_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://news:news@postgres:5432/economic_data
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  economic_pg:
